<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Upscaler</title>
<style>
  body {
    max-width: 40rem;
    margin: 3rem auto;
    padding: 0 1rem;
    font-family: system-ui, sans-serif;
  }
  form {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  button {
    padding: 0.5rem 1.25rem;
  }
  #newStatus {
    margin-top: 1.5rem;
    padding: 0.75rem 1rem;
    border: 1px solid;
    white-space: pre-wrap;
  }
  #newStatus:empty {
    display: none;
  }
  #compare {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    align-self: stretch;
    margin-top: 1rem;
  }
  #compare figure {
    margin: 0;
  }
  #compare img {
    display: block;
    width: 100%;
    max-height: 24rem;
    object-fit: contain;
  }
  #compare figcaption {
    margin-top: 0.25rem;
    font-size: 0.875rem;
    color: #666;
  }
  #resultFig {
    display: none;
  }
</style>
</head>
<body>
  <h1>Image Upscaler</h1>
  <form id="upscaleForm">
    <label>
      Image
      <input type="file" name="image" accept="image/*" required>
    </label>
    <div id="compare">
      <figure>
        <img id="preview" alt="original">
        <figcaption>original</figcaption>
      </figure>
      <figure id="resultFig">
        <img id="resultImg" alt="upscaled">
        <figcaption>upscaled</figcaption>
      </figure>
    </div>
    <label>
      Scale
      <select name="scale">
        <option value="2">2x</option>
        <option value="3" selected>3x</option>
        <option value="4">4x</option>
      </select>
    </label>
    <button type="submit">Upscale</button>
  </form>
  <div id="newStatus"></div>
  <script>
    const fileInput = document.querySelector('input[type=file]');
    const compare = document.getElementById('compare');
    const preview = document.getElementById('preview');
    const resultImg = document.getElementById('resultImg');
    const resultFig = document.getElementById('resultFig');
    const newStatus = document.getElementById('newStatus');
    const form = document.getElementById('upscaleForm');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      resultFig.style.display = 'none';
      newStatus.textContent = '';
      preview.src = file ? URL.createObjectURL(file) : '';
      compare.style.display = file ? 'grid' : 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      newStatus.textContent = 'uploading...';
      resultFig.style.display = 'none';

      const res = await fetch('/upscale', { method: 'POST', body: new FormData(form) });
      if (!res.ok) {
        newStatus.textContent = 'failed to schedule task: ' + await res.text();
        return;
      }
      const { task_id } = await res.json();

      const events = new EventSource(`/tasks/${task_id}/events`);
      events.onmessage = async (e) => {
        newStatus.textContent = e.data;
        if (e.data === 'done') {
          events.close();
          const r = await fetch(`/tasks/${task_id}/result`);
          const { url } = await r.json();
          resultImg.src = url;
          resultFig.style.display = 'block';
        } else if (e.data === 'failed') {
          events.close();
        }
      };
      events.onerror = () => events.close();
    });
  </script>
</body>
</html>
